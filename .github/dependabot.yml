version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # Security update PRs remain enabled; ordinary version-update PRs are disabled.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: fix(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      actions-updates:
        applies-to: version-updates
        patterns:
          - '*'
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore(ci)
